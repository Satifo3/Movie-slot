<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050611">
<title>MOVIE v5 Pixel Cinema</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<div class="app">

  <main>
    <section id="home" class="screen active">
      <div class="cinema">

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

        <div class="side-words left-words">ACTION<br>DRAMA<br>SF<br>COMEDY<br>HORROR<br>AND MORE...</div>
        <div class="side-words right-words">GOOD<br>MOVIES<br>GOOD<br>DAYS.</div>

        <header class="logo-sign">
          <div class="lamp-line"></div>
          <div class="logo-row">
            <span class="logo-letter">M</span>
            <canvas id="logoReel" width="26" height="26"></canvas>
            <span class="logo-letter">VIE</span>
          </div>
          <div class="roulette-label">◆ ROULETTE ◆</div>
        </header>

        <div class="left-prop popcorn-prop"><canvas id="propPopcorn" width="28" height="36"></canvas></div>
        <div class="right-prop clapper-prop"><canvas id="propClapper" width="34" height="34"></canvas><span>LIFE<br>IS A<br>MOVIE.</span></div>

        <section class="slot-machine">
          <div class="slot-lamps"></div>

          <div class="reels-wrap">
            <button class="side-arrow left" type="button">▶</button>

            <div class="reel" id="r1"><canvas class="reel-canvas" width="72" height="168"></canvas></div>
            <div class="reel" id="r2"><canvas class="reel-canvas" width="72" height="168"></canvas></div>
            <div class="reel" id="r3"><canvas class="reel-canvas" width="72" height="168"></canvas></div>

            <button class="side-arrow right" type="button">◀</button>
          </div>

          <button id="spin" class="spin-btn">SPIN!</button>
        </section>

        <div class="mascot human">
          <div class="head"><div class="hair"></div><div class="pixel-glasses blue-red"></div></div>
          <canvas id="mascotPop1" width="22" height="24"></canvas>
        </div>
        <div class="mascot cat">
          <div class="cat-head"><div class="cat-ears"></div><div class="pixel-glasses blue-red"></div></div>
          <canvas id="mascotPop2" width="22" height="24"></canvas>
        </div>

        <div class="catch-copy">🎬 今日の一本が、きっと見つかる 🎬</div>

        <article id="result" class="result-card hidden">
          <div class="film-perf top"></div>

          <div class="result-layout">
            <div id="pixelPoster" class="poster"></div>

            <div class="info">
              <h2 id="title"></h2>
              <div id="yearText" class="year"></div>

              <div id="tags" class="tags"></div>

              <p id="hook" class="synopsis"></p>

              <div id="services" class="services"></div>
            </div>
          </div>

          <div class="result-actions">
            <button id="watched" class="action watched">✓ 観た・評価</button>
            <button id="wish" class="action wish">☆ 観たい</button>
            <button id="again" class="action again">↻ もう一度</button>
          </div>

          <div class="quote-row">
            <div class="quote-avatar"><div class="tiny-face"><div class="tiny-hair"></div><div class="pixel-glasses blue-red"></div></div></div>
            <div id="flavor" class="speech">映画は、選ぶ時間からもう始まってる。</div>
            <div class="life">MOVIE<br>LIFE<br>BETTER</div>
          </div>

          <div class="film-perf bottom"></div>
        </article>

        <div class="seat-row">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </section>

    <section id="genres" class="screen sub-screen">
      <div class="sub-title"><span>☷</span><h2>ジャンル選択</h2></div>
      <div class="filter-card">
        <label>カテゴリ<select id="category"></select></label>
        <label>ジャンル<select id="genre"></select></label>
        <label>配信<select id="service"></select></label>
        <div class="filter-summary" id="filterSummary"></div>
        <button id="applyFilters" class="apply-btn">この条件で映画を選ぶ</button>
      </div>
    </section>

    <section id="watch" class="screen sub-screen">
      <div class="sub-title"><span>♡</span><h2>観たいリスト</h2><b id="wishCount">0</b></div>
      <div id="watchList"></div>
    </section>

    <section id="history" class="screen sub-screen">
      <div class="sub-title"><span>▣</span><h2>視聴履歴</h2><b id="watchedCount">0</b></div>
      <div id="historyList"></div>
    </section>

    <section id="settings" class="screen sub-screen">
      <div class="sub-title"><span>⚙</span><h2>設定</h2></div>
      <div class="settings-card">
        <p>映画データ：<strong>300タイトル</strong></p>
        <p>視聴記録と観たいリストはブラウザ内に保存されます。</p>
        <button id="clearData" class="danger">記録データをすべて削除</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="home"><span>⌂</span><b>ホーム</b></button>
    <button class="nav-btn" data-tab="genres"><span>☷</span><b>ジャンル選択</b></button>
    <button class="nav-btn" data-tab="watch"><span>♡</span><b>観たいリスト</b><em id="wishBadge">0</em></button>
    <button class="nav-btn" data-tab="history"><span>▣</span><b>視聴履歴</b></button>
    <button class="nav-btn" data-tab="settings"><span>⚙</span><b>設定</b></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <h3 id="reviewTitle"></h3>
    <div class="sheet-label">ランク</div>
    <div class="ranks"><button>S</button><button>A</button><button>B</button><button>C</button></div>
    <div class="sheet-label">感想</div>
    <textarea id="memo" placeholder="観終わった直後の気持ちを残す"></textarea>
    <div class="modal-actions"><button id="cancel">キャンセル</button><button id="save">保存</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
