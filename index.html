<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050611">
<title>MOVIE v6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main>
    <section id="home" class="screen active">
      <div class="image-skin">
        <img class="ui-image" src="movie-ui-reference.jpeg" alt="MOVIE ROULETTE UI">

        <!-- Exact-position interactive hit areas -->
        <button id="spin" class="hotspot spin-hotspot" aria-label="SPIN"></button>
        <button class="hotspot nav-home" data-tab="home" aria-label="ホーム"></button>
        <button class="hotspot nav-genres" data-tab="genres" aria-label="ジャンル選択"></button>
        <button class="hotspot nav-watch" data-tab="watch" aria-label="観たいリスト"></button>
        <button class="hotspot nav-history" data-tab="history" aria-label="視聴履歴"></button>
        <button class="hotspot nav-settings" data-tab="settings" aria-label="設定"></button>

        <!-- Animated overlay for slot only -->
        <div id="spinOverlay" class="spin-overlay hidden">
          <div class="mini-reels">
            <div class="mini-reel" id="mr1"></div>
            <div class="mini-reel" id="mr2"></div>
            <div class="mini-reel" id="mr3"></div>
          </div>
        </div>

        <!-- Dynamic result card overlays the static result area in the image -->
        <article id="dynamicResult" class="dynamic-result hidden">
          <div class="film-strip top"></div>
          <div class="result-body">
            <div id="pixelPoster" class="poster"></div>
            <div class="info">
              <h2 id="title"></h2>
              <div id="yearText" class="year"></div>
              <div id="tags" class="tags"></div>
              <p id="hook" class="synopsis"></p>
              <div id="services" class="services"></div>
            </div>
          </div>
          <div class="result-actions">
            <button id="watched" class="action watched">✓ 観た・評価</button>
            <button id="wish" class="action wish">☆ 観たい</button>
            <button id="again" class="action again">↻ もう一度</button>
          </div>
          <div class="quote-row">
            <div class="avatar">👓</div>
            <div id="flavor" class="speech">映画は、選ぶ時間からもう始まってる。</div>
            <div class="life">MOVIE<br>LIFE<br>BETTER</div>
          </div>
          <div class="film-strip bottom"></div>
        </article>
      </div>
    </section>

    <section id="genres" class="screen sub-screen">
      <div class="sub-title"><span>☷</span><h2>ジャンル選択</h2></div>
      <div class="filter-card">
        <label>カテゴリ<select id="category"></select></label>
        <label>ジャンル<select id="genre"></select></label>
        <label>配信<select id="service"></select></label>
        <div id="filterSummary" class="filter-summary"></div>
        <button id="applyFilters" class="apply-btn">この条件でホームへ戻る</button>
      </div>
    </section>

    <section id="watch" class="screen sub-screen">
      <div class="sub-title"><span>♡</span><h2>観たいリスト</h2><b id="wishCount">0</b></div>
      <button class="back-home" data-go-home="1">⌂ ホームへ戻る</button>
      <div id="watchList"></div>
    </section>

    <section id="history" class="screen sub-screen">
      <div class="sub-title"><span>▣</span><h2>視聴履歴</h2><b id="watchedCount">0</b></div>
      <button class="back-home" data-go-home="1">⌂ ホームへ戻る</button>
      <div id="historyList"></div>
    </section>

    <section id="settings" class="screen sub-screen">
      <div class="sub-title"><span>⚙</span><h2>設定</h2></div>
      <div class="settings-card">
        <p>映画データ：<strong>300タイトル</strong></p>
        <p>視聴記録と観たいリストはブラウザ内に保存されます。</p>
        <button id="clearData" class="danger">記録データをすべて削除</button>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <h3 id="reviewTitle"></h3>
    <div class="label">ランク</div>
    <div class="ranks"><button>S</button><button>A</button><button>B</button><button>C</button></div>
    <div class="label">感想</div>
    <textarea id="memo" placeholder="感想を残す"></textarea>
    <div class="modal-actions"><button id="cancel">キャンセル</button><button id="save">保存</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
