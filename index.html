<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>MOVIE v3 Pixel Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crt"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-icon">◉</div>
      <div>
        <h1>MOVIE</h1>
        <p>PIXEL CINEMA ROULETTE</p>
      </div>
    </div>
    <div id="stats">300 TITLES</div>
  </header>

  <nav>
    <button class="active" data-tab="roulette">⌂ ホーム</button>
    <button data-tab="watch">☆ 観たい</button>
    <button data-tab="history">▤ 視聴記録</button>
  </nav>

  <section id="roulette" class="screen active">
    <div class="arcade">
      <div class="top-sign">
        <div class="bulb-row"></div>
        <div class="sign-title">◆ MOVIE ROULETTE ◆</div>
        <div class="bulb-row"></div>
      </div>

      <div class="filters">
        <label>カテゴリ<select id="category"></select></label>
        <label>ジャンル<select id="genre"></select></label>
        <label>配信<select id="service"></select></label>
      </div>

      <div class="slot">
        <div class="cabinet-dots"></div>
        <div class="reel-window">
          <div class="reel" id="r1"><div class="strip"><span class="slot-sprite">🍿</span><b>READY</b></div></div>
          <div class="reel" id="r2"><div class="strip"><span class="slot-sprite">⭐</span><b>SET</b></div></div>
          <div class="reel" id="r3"><div class="strip"><span class="slot-sprite">🎬</span><b>MOVIE</b></div></div>
        </div>
        <div class="lever"><i></i></div>
        <button id="spin">SPIN!</button>
        <div class="cabinet-caption">SELECT → SPIN → WATCH</div>
      </div>

      <div class="message">🎞 今日の一本が、きっと見つかる 🎞</div>

      <div id="result" class="result hidden">
        <div class="ticket-head">
          <span>ADMIT ONE</span>
          <strong id="title"></strong>
          <small id="categoryTag"></small>
        </div>

        <div class="result-main">
          <div id="pixelPoster" class="pixel-poster" aria-label="オリジナル・ピクセルポスター"></div>
          <div class="result-info">
            <div id="tags"></div>
            <p id="hook"></p>
            <div id="services"></div>
          </div>
        </div>

        <div class="actions">
          <button id="watched">✓ 観た・評価</button>
          <button id="wish">☆ 観たい</button>
          <button id="again">↻ もう一度</button>
        </div>

        <div class="flavor" id="flavor">🎬 今夜は映画館モード。</div>
      </div>

      <p class="notice">
        ポスター欄は公式画像の複製ではなく、作品タイトル・ジャンルを手掛かりにアプリ内で自動生成するオリジナルのドット絵風ビジュアルです。
      </p>
    </div>
  </section>

  <section id="watch" class="screen"><div class="panel"><h2>☆ 観たいリスト</h2><div id="watchList"></div></div></section>
  <section id="history" class="screen"><div class="panel"><h2>▤ 視聴記録</h2><div id="historyList"></div></div></section>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <h3 id="reviewTitle"></h3>
    <div class="ranks"><button>S</button><button>A</button><button>B</button><button>C</button></div>
    <textarea id="memo" placeholder="感想を残す"></textarea>
    <div class="actions"><button id="cancel">キャンセル</button><button id="save">保存</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
